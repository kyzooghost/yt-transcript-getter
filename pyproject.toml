[project]
name = "yt-transcript-fetcher"
version = "0.1.0"
description = "A CLI tool to fetch YouTube video transcripts and save them as Markdown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "youtube-transcript-api>=0.6.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
yt-transcript = "yt_transcript_fetcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_transcript_fetcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
